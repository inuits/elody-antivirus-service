---
variables:
  IMAGE_NAME: dams-antivirus

include:
  - component: $CI_SERVER_FQDN/rnd/inuits/dams/ci-components/build-security-deliver@v0.0.7
    inputs:
      image_name: ${IMAGE_NAME}

  - component: $CI_SERVER_FQDN/rnd/inuits/dams/ci-components/deliver-customers@v0.0.7
    inputs:
      image_name: ${IMAGE_NAME}
      values_key: .antivirus
      customers:
        - CUSTOMER: digipolis-damsv2
          VALUES_REPO: customers/digipolis/dams-v2/digipolis-dams-v2-helm-values
